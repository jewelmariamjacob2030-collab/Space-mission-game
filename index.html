<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Space Mission Design Game</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#14192b;--mu:#5b6482;--ac:#3b5bdb;--ok:#2b9348;--bad:#d62839;--bd:#d5daea;--on:#e7ecff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#151c33;--tx:#e8ecfa;--mu:#9aa5c8;--ac:#7c9bff;--ok:#4cc26b;--bad:#ff6b7a;--bd:#2a3558;--on:#1f2b55;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#151c33;--tx:#e8ecfa;--mu:#9aa5c8;--ac:#7c9bff;--ok:#4cc26b;--bad:#ff6b7a;--bd:#2a3558;--on:#1f2b55;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
h1{margin:.2em 0;font-size:1.7rem}h2{font-size:1.1rem;margin:0 0 4px}p{margin:.3em 0}
.sub{color:var(--mu)}
section,.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.why{color:var(--mu);font-size:.88rem;margin:2px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.card{text-align:left;background:var(--bg);color:var(--tx);border:2px solid var(--bd);border-radius:10px;padding:9px;cursor:pointer;font:inherit}
.card.on{border-color:var(--ac);background:var(--on)}.card small{display:block;color:var(--mu);font-size:.8rem}
.tag{font-size:.72rem;background:var(--on);color:var(--ac);border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
select,input{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 8px}
.m{margin:8px 0}.m div.l{display:flex;justify-content:space-between;font-size:.85rem}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}.bar.x i{background:var(--bad)}
button.go{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 22px;font:700 1rem inherit;cursor:pointer;width:100%}
button.sm{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.res li{margin:5px 0;list-style:none}.res ul{padding:0}.g{color:var(--ok)}.b{color:var(--bad)}
.big{font-size:1.5rem;font-weight:800}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.88rem}td,th{padding:5px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
#ov:empty{display:none}#ov{position:fixed;inset:0;background:rgba(5,8,20,.94);z-index:9;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}.ovb{width:min(92vw,360px);color:#e8ecfa;text-align:center}#cv{width:100%;max-height:68vh;aspect-ratio:2/3;background:#050814;border-radius:12px;touch-action:none;border:1px solid #2a3558}.hud{font:700 .9rem system-ui;display:flex;justify-content:space-between;margin:4px 2px}.ovb .why{color:#9aa5c8}#vw{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;max-width:860px;height:210px;margin:8px auto 0;border-radius:14px;overflow:hidden;background:radial-gradient(#1a2347,#050814);border:1px solid var(--bd)}#c3{width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}#vl{position:absolute;left:10px;right:10px;bottom:6px;font-size:.72rem;color:#c9d3f5;text-shadow:0 1px 3px #000;pointer-events:none}.gt{background:linear-gradient(90deg,var(--ac),#ff8a5c);-webkit-background-clip:text;background-clip:text;color:transparent}.hudb{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;margin:8px 0}.lv{font-weight:800;font-size:1.2rem;line-height:1.1}.lv small{display:block;font-size:.7rem;color:var(--mu);font-weight:600}.xp{flex:1}.xp small{color:var(--mu);font-size:.75rem}.cr{font-weight:800}.tabs{display:flex;gap:6px;margin:8px 0}.tabs button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:9px;font:600 .9rem system-ui;cursor:pointer}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}.toast{background:var(--on);border:1px solid var(--ac);border-radius:10px;padding:8px 12px;margin:8px 0;font-weight:600}section{box-shadow:0 2px 10px rgba(0,0,0,.06)}.card{transition:transform .12s}.card:hover{transform:translateY(-2px)}.track{position:relative;height:34px;background:#222b4d;border-radius:8px;margin:14px 0}.zone{position:absolute;top:0;bottom:0;background:#2b9348aa;border-radius:6px}.mark{position:absolute;top:2px;bottom:2px;width:4%;background:#fff;border-radius:5px}.pad{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.pad button{height:90px;border:0;border-radius:14px;cursor:pointer;transition:opacity .15s}</style></head><body><div id="vw"><canvas id="c3"></canvas><div id="vl"></div></div><main id="app"></main><div id="ov"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const D={
scn:[{n:"Lunar Ice Hunter",d:"Map water ice near the Moon’s south pole.",b:650,m:900,s:1,r:1,g:8,w:"Moon: close to Earth and full sunlight."},
{n:"Mars Climate Orbiter",d:"Study Mars’s weather and dust storms.",b:800,m:1000,s:.43,r:2,g:10,w:"Mars: sunlight is only ~43% as strong, and signals travel farther."},
{n:"Europa Ocean Scout",d:"Search for signs of a hidden ocean on Jupiter’s moon.",b:1000,m:1100,s:.04,r:3,g:12,w:"Europa: almost no sunlight (~4%), and a long way from Earth."}],
pw:[{n:"Small solar array",w:200,k:0,m:60,c:40},{n:"Large solar array",w:600,k:0,m:150,c:90},{n:"RTG (nuclear battery)",w:300,k:1,m:90,c:160}],
cm:[{n:"Low-gain antenna",r:1,p:20,m:10,c:20},{n:"Medium-gain antenna",r:4,p:60,m:40,c:60},{n:"High-gain dish",r:12,p:120,m:90,c:120}],
pl:[{n:"Camera",s:3,p:40,d:3,m:30,c:50},{n:"Spectrometer",s:4,p:80,d:2,m:50,c:80},{n:"Radar sounder",s:6,p:150,d:5,m:120,c:150},{n:"Magnetometer",s:2,p:20,d:1,m:10,c:25}],
ob:[{n:"Low orbit",x:1.3,m:150,c:80},{n:"High orbit",x:1,m:80,c:50},{n:"Flyby",x:.6,m:40,c:30}],
ev:[{id:"none",n:"Quiet space weather",t:"Nothing unexpected happened."},
{id:"flare",n:"Solar flare",t:"A solar storm cut solar power by 25%. RTGs are not affected."},
{id:"meteor",n:"Micro-meteoroid hit",t:"Debris damaged an instrument (-20% science) unless you kept 10%+ spare mass for shielding."},
{id:"glitch",n:"Antenna glitch",t:"Data rate dropped 30% unless you flew the high-gain dish."},
{id:"cut",n:"Budget cut",t:"Your budget was cut by 10% mid-development."}]};
const ROLES=["Mission Lead","Power Engineer","Comms Engineer","Science Lead"];
const sum=(a,k)=>a.reduce((t,x)=>t+x[k],0);
const st={fund:0,tab:0,toast:'',mode:0,df:1,pn:1,sc:0,pw:1,cm:1,pl:[0],ob:1,mo:12,res:null,hist:[],msg:""};
function calc(e){const sc=D.scn[st.sc],P=D.pw[st.pw],C=D.cm[st.cm],L=st.pl.map(i=>D.pl[i]),O=D.ob[st.ob];
let bud=sc.b*[1.2,1,.85][st.df]+st.fund;if(e=="cut")bud*=.9;
const mass=150+P.m+C.m+O.m+sum(L,"m"),cost=100+P.c+C.c+O.c+sum(L,"c")+st.mo*4;
let gen=P.k?P.w:P.w*sc.s;if(e=="flare"&&!P.k)gen*=.75;
const use=50+C.p+sum(L,"p"),need=sum(L,"d");let rate=C.r/sc.r;if(e=="glitch"&&C.r<12)rate*=.7;
const ret=need?Math.min(1,rate/need):0;
let sci=sum(L,"s")*O.x*Math.pow(st.mo/12,.8)*ret;if(e=="meteor"&&mass>sc.m*.9)sci*=.8;
return{sc,bud,mass,cost,gen,use,need,rate,ret,sci,ml:sc.m}}
const set=(k,v)=>{st[k]=+v;st.res=null;render()};
const tog=i=>{const a=st.pl,j=a.indexOf(i);j<0?a.push(i):a.splice(j,1);a.sort();st.res=null;render()};
const card=(on,fn,h,s)=>`<button class="card${on?" on":""}" onclick="${fn}"><b>${h}</b><small>${s}</small></button>`;
const own=i=>st.pn>1?`<span class="tag">Player ${i%st.pn+1} · ${ROLES[i]}</span>`:"";
const sec=(i,t,why,body)=>`<section><h2>${t}${own(i)}</h2><p class="why">${why}</p>${body}</section>`;
const meter=(l,v,mx,u,min)=>{const ok=min?v>=mx:v<=mx;return`<div class="m"><div class="l"><span>${l}</span><span>${Math.round(v*10)/10} / ${Math.round(mx*10)/10} ${u}</span></div><div class="bar${ok?"":" x"}"><i style="width:${Math.min(100,v/mx*100)}%"></i></div></div>`};
function finish(ev,gf){const r=calc(ev.id),sb=st.mode==1,L=[];r.sci*=gf;
const add=(ok,t)=>L.push([ok,t]);
add(r.mass<=r.ml,`<b>Mass:</b> ${r.mass} kg of ${r.ml} kg allowed. Every kilogram needs rocket fuel to launch, so heavy designs cannot leave Earth.`);
add(r.cost<=r.bud,`<b>Budget:</b> ${r.cost} of ${Math.round(r.bud)} units. Longer missions cost more because teams on the ground must be paid.`);
add(r.gen>=r.use,`<b>Power:</b> ${Math.round(r.gen)} W made, ${r.use} W needed. ${r.sc.w} Instruments and radios shut down if power runs short.`);
add(r.ret>=1,`<b>Communications:</b> your radio can send ${Math.round(r.rate*10)/10} data units but instruments make ${r.need}. ${r.ret>=1?"All data reached Earth.":"Only "+Math.round(r.ret*100)+"% of the data came home, and science you cannot send is wasted."}`);
add(r.sci>=r.sc.g,`<b>Science:</b> ${Math.round(r.sci*10)/10} points returned, goal is ${r.sc.g}. Closer orbits see more detail, and more months mean more observations.`);
const hard=!sb&&(r.mass>r.ml||r.cost>r.bud||r.gen<r.use);
const pct=hard?0:Math.min(100,Math.round(r.sci/r.sc.g*100));
const goals=[[r.cost<=.9*r.bud,"Mission Lead: finish 10% under budget"],[r.gen>=1.2*r.use,"Power Engineer: keep 20% spare power"],[r.ret>=1,"Comms Engineer: bring home 100% of the data"],[r.sci>=1.2*r.sc.g,"Science Lead: beat the goal by 20%"]];
const code=`${st.sc}${st.pw}${st.cm}${st.ob}-${st.pl.join("")}-${st.mo}`;
st.res={ev,L,pct,hard,goals,code};
st.hist.push({code,n:r.sc.n,pct,cost:r.cost,mass:r.mass});if(!sb&&pct>0)postScore({code,df:st.df,mode:st.mode,fund:st.fund,team:st.pn,pct});PF.n++;PF.best=Math.max(PF.best,pct);st.res.gain=award(sb?5:Math.round((hard?5:15+pct*.6+(st.pn>1?goals.filter(g=>g[0]).length*5:0))*[.8,1,1.5][st.df]),sb?0:Math.round(pct/4),'',['first',pct>=100&&!sb?'perfect':0,st.pn>1?'team':0]);render();setTimeout(()=>document.getElementById("res")?.scrollIntoView({behavior:"smooth"}),50)}
function load(){const m=/^(\d)(\d)(\d)(\d)-(\d{1,4})-(\d+)$/.exec(document.getElementById("code").value.trim());
if(m&&+m[1]<3&&+m[2]<3&&+m[3]<3&&+m[4]<3&&[...m[5]].every(c=>c<4)&&[6,12,24].includes(+m[6])){Object.assign(st,{sc:+m[1],pw:+m[2],cm:+m[3],ob:+m[4],pl:[...new Set([...m[5]].map(Number))].sort(),mo:+m[6],res:null,msg:"Design loaded."})}else st.msg="That design code is not valid.";render()}
function render(){const c=calc(null),sb=st.mode==1,sc=c.sc,R=st.res;
let h=`<p class="sub">Build a spacecraft, balance power, mass, budget, communications and time, then launch and learn why it worked or failed.</p>
<section><div class="row"><label>Mode <select onchange="set('mode',this.value)"><option value="0"${!st.mode?" selected":""}>Mission (with limits)</option><option value="1"${sb?" selected":""}>Sandbox (no limits)</option></select></label>
<label>Difficulty <select onchange="set('df',this.value)">${["Easy (bigger budget)","Normal","Hard (smaller budget)"].map((t,i)=>`<option value="${i}"${st.df==i?" selected":""}>${t}</option>`).join("")}</select></label>
<label>Team size <select onchange="set('pn',this.value)">${[1,2,3,4].map(i=>`<option${st.pn==i?" selected":""}>${i}</option>`).join("")}</select></label></div>
${st.pn>1?`<p class="why">Team mode: each player owns a subsystem. Discuss and negotiate: the budget, mass and power are shared, so one player’s upgrade is another’s problem. After launch, see how many of your four role goals the team met.</p>`:""}</section>
<section><h2>1. Choose your mission</h2><div class="grid">${D.scn.map((s,i)=>card(st.sc==i,`set('sc',${i})`,s.n,s.d+` Goal: ${s.g} science points.`)).join("")}</div></section>`;
h+=sec(0,"2. Orbit and duration","Lower orbits see more detail but need fuel (mass). Longer missions collect more science but cost more to operate.",
`<div class="grid">${D.ob.map((o,i)=>card(st.ob==i,`set('ob',${i})`,o.n,`Science ×${o.x} · ${o.m} kg · ${o.c} cost`)).join("")}</div><p class="row" style="margin-top:8px">${[6,12,24].map(m=>`<button class="sm" style="${st.mo==m?"border-color:var(--ac);font-weight:700":""}" onclick="set('mo',${m})">${m} months</button>`).join("")}</p>`);
h+=sec(1,"3. Power system","A spacecraft needs electricity for everything. Solar panels weaken far from the Sun; an RTG makes steady power anywhere but is expensive.",
`<div class="grid">${D.pw.map((p,i)=>card(st.pw==i,`set('pw',${i})`,p.n,`${p.w} W${p.k?" (any distance)":" at Earth"} · ${p.m} kg · ${p.c} cost`)).join("")}</div>`);
h+=sec(2,"4. Communications","Data rate is how fast you can send science home. The farther away you are, the weaker the signal, so you need a bigger antenna.",
`<div class="grid">${D.cm.map((p,i)=>card(st.cm==i,`set('cm',${i})`,p.n,`Rate ${p.r} · ${p.p} W · ${p.m} kg · ${p.c} cost`)).join("")}</div>`);
h+=sec(3,"5. Science instruments (pick any)","Instruments create science points, but also use power, make data you must transmit, and add mass.",
`<div class="grid">${D.pl.map((p,i)=>card(st.pl.includes(i),`tog(${i})`,(st.pl.includes(i)?"✓ ":"")+p.n,`Science ${p.s} · Data ${p.d} · ${p.p} W · ${p.m} kg · ${p.c} cost`)).join("")}</div>`);
h+=`<section><h2>Live mission dashboard</h2><p class="why">${sc.w}</p>${meter("Budget",c.cost,c.bud,"units")}${meter("Mass",c.mass,c.ml,"kg")}${meter("Power use vs supply",c.use,Math.max(1,c.gen),"W")}${meter("Data returned",c.ret*100,100,"%",1)}${meter("Science",c.sci,sc.g,"pts",1)}
${st.df==0?`<p class="why">Hint: red bars mean a limit is broken. Fix power first, then communications, then add science.</p>`:""}</section>
<button class="go" onclick="go()">Launch mission 🚀</button>`;
if(R){h+=`<section id="res" class="res"><h2>Mission report: ${sc.n}</h2><p class="big ${R.hard?"b":R.pct>=100?"g":""}">${R.hard?"Mission failed on the launch pad":R.pct>=100?"Mission success":R.pct>=60?"Partial success":"Mission fell short"} · ${R.pct}%</p>
<p><b>Event: ${R.ev.n}.</b> ${R.ev.t}</p><h2>Post-mission analysis</h2><ul>${R.L.map(([ok,t])=>`<li class="${ok?"g":"b"}">${ok?"✔":"✖"} <span style="color:var(--tx)">${t}</span></li>`).join("")}</ul>
${R.hard?`<p>In Mission mode, a design that breaks mass, budget or power limits cannot succeed. Try the Sandbox to experiment freely.</p>`:""}
${st.pn>1?`<h2>Team role goals: ${R.goals.filter(g=>g[0]).length}/4 met</h2><ul>${R.goals.map(([ok,t])=>`<li class="${ok?"g":"b"}">${ok?"✔":"✖"} ${t}</li>`).join("")}</ul>`:""}
${R.gain?`<p class='big g'>${R.gain}</p>`:''}<p class="why">Design code (share it or compare later): <b>${R.code}</b></p></section>`}
h+=`<section><h2>Save, share and compare designs</h2><div class="row"><input id="code" placeholder="e.g. 1121-013-12" size="14"><button class="sm" onclick="load()">Load design code</button><span class="sub">${st.msg}</span></div>`;
if(st.hist.length)h+=`<div class="tw"><table><tr><th>#</th><th>Mission</th><th>Code</th><th>Score</th><th>Cost</th><th>Mass</th></tr>${st.hist.map((x,i)=>`<tr><td>${i+1}</td><td>${x.n}</td><td>${x.code}</td><td>${x.pct}%</td><td>${x.cost}</td><td>${x.mass}</td></tr>`).join("")}</table></div>`;
h+=`</section><p class="sub" style="font-size:.8rem">Simplified model for learning, not real flight engineering. Built for the NASA Space Apps Challenge.</p>`;
st.msg="";document.getElementById("app").innerHTML=head()+(st.tab==0?h:tab2());st.toast=''}
let G=null;const kd=e=>{if(G)G.keys[e.key]=1},ku=e=>{if(G)G.keys[e.key]=0};
function go(){const c=calc(null),hull=c.mass<=c.ml*.9?4:3;
G={c,P:D.pw[st.pw],hull,max:hull,pw:100,t:0,dur:25+st.mo/6*3,x:160,o:[],sp:0,col:0,spn:0,fl:0,mt:0,keys:{},raf:0,last:performance.now()};
document.getElementById("ov").innerHTML=`<div class="ovb"><div class="hud" id="hud"></div><canvas id="cv" width="320" height="480"></canvas><p class="why">Drag or use ← → to steer. Blue = science data, yellow = power cell, grey = debris, orange = solar flare.</p><button class="sm" onclick="endGame(1)">Abort mission</button></div>`;
const cv=document.getElementById("cv"),mv=e=>{const r=cv.getBoundingClientRect();G.x=(e.clientX-r.left)/r.width*320};
cv.onpointermove=mv;cv.onpointerdown=mv;addEventListener("keydown",kd);addEventListener("keyup",ku);G.raf=requestAnimationFrame(loop)}
function loop(n){const g=G;if(!g)return;const dt=Math.min(.05,(n-g.last)/1000);g.last=n;g.t+=dt;g.fl-=dt;
if(g.keys.ArrowLeft)g.x-=230*dt;if(g.keys.ArrowRight)g.x+=230*dt;g.x=Math.max(14,Math.min(306,g.x));
g.sp-=dt;if(g.sp<=0){g.sp=.45;const r=Math.random(),k=r<.45?"d":r<.75?"a":r<.87?"p":"f";if(k=="d")g.spn++;g.o.push({x:18+Math.random()*284,y:-10,k,s:80+Math.random()*70+g.t*2})}
g.pw-=4*dt*Math.min(2.5,Math.max(.3,g.c.use/Math.max(1,g.c.gen)));
g.o=g.o.filter(o=>{o.y+=o.s*dt;if(Math.abs(o.x-g.x)<17&&o.y>425&&o.y<465){if(o.k=="d")g.col++;else if(o.k=="p")g.pw=Math.min(100,g.pw+20);else if(o.k=="a"){g.hull--;g.mt=1;g.fl=.4}else{if(!g.P.k)g.pw-=25;g.fv=1;g.fl=.4}return false}return o.y<490});
draw();if(g.t>=g.dur||g.hull<=0||g.pw<=0)endGame(0);else g.raf=requestAnimationFrame(loop)}
function draw(){const g=G,x=document.getElementById("cv").getContext("2d");x.fillStyle="#050814";x.fillRect(0,0,320,480);x.fillStyle="#fff";
for(let i=0;i<30;i++)x.fillRect((i*97)%320,(i*53+g.t*60*(1+i%3))%480,1.5,1.5);
for(const o of g.o){x.fillStyle={d:"#4dabf7",a:"#868e96",p:"#ffd43b",f:"#ff922b"}[o.k];x.beginPath();x.arc(o.x,o.y,o.k=="a"?11:8,0,7);x.fill()}
x.fillStyle=g.fl>0?"#ff6b6b":"#e8ecfa";x.beginPath();x.moveTo(g.x,425);x.lineTo(g.x-12,460);x.lineTo(g.x+12,460);x.fill();
document.getElementById("hud").innerHTML=`<span>❤ ${g.hull}/${g.max}</span><span>⚡ ${Math.max(0,Math.round(g.pw))}%</span><span>📡 ${g.col}</span><span>⏱ ${Math.max(0,Math.round(g.dur-g.t))}s</span>`}
function endGame(abort){const g=G;G=null;cancelAnimationFrame(g.raf);removeEventListener("keydown",kd);removeEventListener("keyup",ku);document.getElementById("ov").innerHTML="";if(abort)return;
let f=g.spn?g.col/g.spn:0;const dead=g.hull<=0,out=g.pw<=0;if(dead||out)f*=.4;
const ev=D.ev[g.fv&&!g.P.k?1:g.mt?2:0],note=` Flight result: ${g.col} of ${g.spn} data packets collected, hull ${Math.max(0,g.hull)}/${g.max}, power ${Math.max(0,Math.round(g.pw))}%.${dead?" The spacecraft was destroyed by debris.":""}${out?" Power ran out and systems shut down.":""}`;
finish({...ev,t:ev.t+note},.4+.6*f)}
